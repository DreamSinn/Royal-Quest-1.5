<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">RQ 1.5 — Royal Quest</title>
  <desc id="description">Uma cena medieval fantástica original com castelo, montanhas, estrelas douradas e o nome RQ 1.5.</desc>
  <defs>
